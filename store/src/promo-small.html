<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Klipit small promo tile</title>
    <link rel="stylesheet" href="field.css" />
    <style>
      /* 440x280 at device scale 1 */
      :root { --margin-x: 36px; }
      .brand { top: 50px; }
      .brand-row { font-size: 54px; }
      .rule { top: 146px; width: auto; right: 0; }
      .idea { position: absolute; left: var(--margin-x); top: 166px; width: 360px; font-size: 18px; }
    </style>
  </head>
  <body>
    <div class="brand">
      <div class="brand-row"><img src="../../assets/klippit-mark.svg" alt="" />Klipit</div>
    </div>
    <div class="rule plain"></div>
    <p class="idea">Save links with a note on why they mattered, then connect them.</p>
  </body>
</html>
